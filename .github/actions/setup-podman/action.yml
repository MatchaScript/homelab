name: "Setup Podman"
description: "Use the runner's preinstalled Podman with native overlay diff restored."

runs:
  using: "composite"
  steps:
    # Runner images since 20260810 ship a preseeded /var/lib/containers/storage
    # whose .has-mount-program flag forces the fuse-overlayfs path, and their
    # 6.17 azure kernel enables overlay redirect_dir, which fails the native
    # diff probe on default mount options. Either one alone drops every layer
    # commit to a full-tree naive diff (~95s per layer on a 3GB base; ~100x
    # slower than native). Fresh storage + redirect_dir=off restores native
    # diff; both are required.
    #
    # storage.conf replaces the distro default instead of merging into it, so
    # the store roots have to be spelled out. Podman 4.9.3, back on the runner
    # images since 20260828, errors with "runroot must be set" without them;
    # the bundled 5.8.4 filled them in.
    - name: Restore native overlay diff
      shell: bash
      run: |
        set -euo pipefail
        sudo rm -rf /var/lib/containers/storage /run/containers/storage
        sudo mkdir -p /etc/containers
        sudo tee /etc/containers/storage.conf <<'EOF'
        [storage]
        driver = "overlay"
        runroot = "/run/containers/storage"
        graphroot = "/var/lib/containers/storage"
        [storage.options.overlay]
        mountopt = "redirect_dir=off"
        EOF

    # Ubuntu's bwrap-userns-restrict profile attaches by path, so it also
    # catches /usr/bin/bwrap inside the build container. bwrap execs into
    # bwrap//&unpriv_bwrap, which denies dac_override and dac_read_search, and
    # rpm-ostree's systemd-sysusers step then cannot read the mode 0000
    # /etc/gshadow, so every build-rootfs fails. --security-opt
    # apparmor=unconfined does not cover it: the container process is
    # unconfined, but the exec transition into the profile still happens.
    - name: Unload the bwrap AppArmor profile
      shell: bash
      run: |
        set -euo pipefail
        if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
        fi

    - name: Report container tools and storage
      shell: bash
      run: |
        set -euo pipefail
        which -a podman
        podman version
        buildah --version
        skopeo --version
        sudo podman info --format '{{range $k, $v := .Store.GraphStatus}}{{$k}}: {{$v}}{{"\n"}}{{end}}'
