name: "Setup Podman"
description: "Report the runner's preinstalled container tools (Podman 5.x ships with the runner image since 20260810)."

runs:
  using: "composite"
  steps:
    - name: Report container tool versions
      shell: bash
      run: |
        set -euo pipefail
        which -a podman
        podman version
        buildah --version
        skopeo --version
        sudo podman info --format 'graph driver: {{.Store.GraphDriverName}}'
