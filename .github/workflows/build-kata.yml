name: Build Kata Artifacts

# Builds kata-containers from the fork carrying the netkit L3 patch and packs
# the /opt/kata install tree into an artifact-only image that node images pull
# in with `COPY --from=`. Dispatch-only until the cold build cost is known.

on:
  workflow_dispatch:
    inputs:
      kata_repo:
        description: "Source repository to build"
        type: string
        default: MatchaScript/kata-containers
      kata_ref:
        description: "Commit or branch to build"
        type: string
        default: 90559846d48d799ae1d5c3da8dfb00822528a1b7
      push:
        description: "Push the artifact image to ghcr.io"
        type: boolean
        default: false

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kata-artifacts

jobs:
  build-asset:
    name: build-asset (${{ matrix.asset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        asset:
          - agent
          - busybox
          - cloud-hypervisor
          - kernel
          - pause-image
          - qemu
          - virtiofsd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.kata_repo }}
          ref: ${{ inputs.kata_ref }}
          persist-credentials: false

      - name: Build ${{ matrix.asset }}
        run: |
          make "${KATA_ASSET}-tarball"
          build_dir=$(readlink -f build)
          mkdir -p kata-build
          cp "${build_dir}"/kata-static-"${KATA_ASSET}".tar.zst kata-build/
        env:
          KATA_ASSET: ${{ matrix.asset }}
          ARTEFACT_REGISTRY: ghcr.io
          ARTEFACT_REGISTRY_USERNAME: ${{ github.actor }}
          ARTEFACT_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TO_REGISTRY: "no"
          USE_DEVMAPPER: ${{ matrix.asset == 'agent' && 'yes' || 'no' }}

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kata-asset-${{ matrix.asset }}
          path: kata-build/kata-static-${{ matrix.asset }}.tar.zst
          retention-days: 7
          if-no-files-found: error

  build-asset-rootfs:
    name: build-asset-rootfs (rootfs-image)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: build-asset
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.kata_repo }}
          ref: ${{ inputs.kata_ref }}
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: kata-asset-*
          path: kata-artifacts
          merge-multiple: true

      - name: Build rootfs-image
        run: |
          make install-prebuilt-artifacts
          make DEPS= rootfs-image-tarball
          build_dir=$(readlink -f build)
          mkdir -p kata-build
          cp "${build_dir}"/kata-static-rootfs-image.tar.zst kata-build/
        env:
          ARTEFACT_REGISTRY: ghcr.io
          ARTEFACT_REGISTRY_USERNAME: ${{ github.actor }}
          ARTEFACT_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TO_REGISTRY: "no"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kata-asset-rootfs-image
          path: kata-build/kata-static-rootfs-image.tar.zst
          retention-days: 7
          if-no-files-found: error

  build-asset-shim-v2:
    name: build-asset-shim-v2 (shim-v2-go)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.kata_repo }}
          ref: ${{ inputs.kata_ref }}
          persist-credentials: false

      - name: Build shim-v2-go
        run: |
          make shim-v2-go-tarball
          build_dir=$(readlink -f build)
          mkdir -p kata-build
          cp "${build_dir}"/kata-static-shim-v2-go.tar.zst kata-build/
        env:
          ARTEFACT_REGISTRY: ghcr.io
          ARTEFACT_REGISTRY_USERNAME: ${{ github.actor }}
          ARTEFACT_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TO_REGISTRY: "no"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kata-asset-shim-v2-go
          path: kata-build/kata-static-shim-v2-go.tar.zst
          retention-days: 7
          if-no-files-found: error

  package:
    name: Package artifact image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build-asset, build-asset-rootfs, build-asset-shim-v2]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: kata-asset-*
          path: kata-artifacts
          merge-multiple: true

      - name: Unpack tarballs into a build context
        run: |
          mkdir -p kata-root
          for tarball in kata-artifacts/*.tar.zst; do
            echo "unpacking ${tarball}"
            tar -I zstd -xf "${tarball}" -C kata-root
          done
          test -x kata-root/opt/kata/bin/containerd-shim-kata-v2
          find kata-root/opt/kata -maxdepth 2 -type d | sort

      - name: Build artifact image
        run: |
          docker build \
            --platform linux/amd64 \
            --label org.opencontainers.image.source="https://github.com/${{ inputs.kata_repo }}" \
            --label org.opencontainers.image.revision="${{ inputs.kata_ref }}" \
            --label org.opencontainers.image.description="kata-containers /opt/kata install tree (netkit L3 patch)" \
            -f containers/kata/Containerfile \
            -t "${IMAGE_NAME}:latest" \
            kata-root

      - name: Push
        if: ${{ inputs.push }}
        run: |
          target="${REGISTRY}/${OWNER,,}/${IMAGE_NAME}:${{ inputs.kata_ref }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin "${REGISTRY}"
          docker tag "${IMAGE_NAME}:latest" "${target}"
          docker push "${target}"
          echo "pushed ${target}"
        env:
          OWNER: ${{ github.repository_owner }}
