name: Build Che Development image

on:
  schedule:
    # 3日おき UTC 02:00 = JST 11:00
    - cron: "0 2 */3 * *"
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to registry"
        required: true
        default: false
        type: boolean
      target_registry:
        description: "Target registry (override default)"
        required: false
        type: string
        default: "ghcr.io"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: matchascript
  IMAGE: ubuntu-development
  # renovate: datasource=docker depName=docker.io/library/ubuntu
  DEV_BASE: "docker.io/library/ubuntu:latest@sha256:513c074113a871b51a8d16ab445c88779d6452d937a164fb5cc479f32668a41d"
  CONTEXT_DIR: ./containers

jobs:
  build:
    name: Build Che development image (amd64)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Podman
        uses: ./.github/actions/setup-podman

      - name: Compute build metadata
        id: meta
        env:
          TZ: "Asia/Tokyo"
          INPUT_REGISTRY: ${{ inputs.target_registry }}
        run: |
          set -euo pipefail
          echo "current_date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          VERSION_ID=$(sudo podman run --rm "$DEV_BASE" cat /etc/os-release | grep '^VERSION_ID=' | cut -d= -f2 | tr -d '"')
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "registry=${INPUT_REGISTRY:-${REGISTRY}}" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "devel" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate OCI labels
        id: labels
        uses: ./.github/actions/oci-labels
        with:
          title: ${{ env.IMAGE }}
          description: "Development environment image for Eclipse Che workspaces"
          version: "${{ steps.meta.outputs.version_id }}.${{ steps.meta.outputs.current_date }}"
          base_name: ${{ env.DEV_BASE }}

      - name: Build image
        env:
          OCI_LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          set -euo pipefail
          LABEL_ARGS=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            LABEL_ARGS+=(--label "$line")
          done <<< "$OCI_LABELS"

          sudo podman build \
            --platform linux/amd64 \
            --build-arg DEV_BASE="${DEV_BASE}" \
            "${LABEL_ARGS[@]}" \
            --tag temp-dev \
            -f "${CONTEXT_DIR}/che/development.Containerfile" \
            "${CONTEXT_DIR}"

      - name: Test image
        run: |
          sudo podman run --rm temp-dev sh -c '
            set -e
            id | grep -q "uid=1234(user) gid=0(root)"
            test "$HOME" = /home/user
            command -v nohup
            for t in zsh git podman pasta mise chezmoi uv kubectl helm k9s tofu bao gh starship argocd cilium hubble fd rg docker; do
              command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }
            done
            docker buildx version
            docker compose version
          '
          sudo podman run -d --name sshd-test temp-dev
          sleep 3
          sudo podman exec sshd-test ssh-keyscan -p 2022 127.0.0.1 | grep -q ssh-ed25519
          sudo podman rm -f sshd-test

      - name: Generate tags
        id: tags
        uses: ./.github/actions/image-tags
        with:
          image_prefix: ${{ steps.meta.outputs.registry }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}
          branch: ${{ steps.meta.outputs.branch_name }}
          date: ${{ steps.meta.outputs.current_date }}
          version: ${{ steps.meta.outputs.version_id }}
          arches: "amd64 -"

      - name: Login to registry
        if: ${{ (inputs.push_images == true || github.event_name == 'schedule') && steps.meta.outputs.can_push == 'true' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login -u "${{ github.actor }}" --password-stdin "${{ steps.meta.outputs.registry }}"

      - name: Tag and push
        if: ${{ (inputs.push_images == true || github.event_name == 'schedule') && steps.meta.outputs.can_push == 'true' }}
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $(echo "$TAGS" | tr ',' ' '); do
            sudo podman tag temp-dev "${tag}"
            sudo podman push "${tag}"
            echo "Pushed: ${tag}"
          done

      - name: Sign image (cosign keyless)
        if: ${{ (inputs.push_images == true || github.event_name == 'schedule') && steps.meta.outputs.can_push == 'true' }}
        uses: ./.github/actions/cosign-sign
        with:
          references: ${{ steps.tags.outputs.tags }}
          registry: ${{ steps.meta.outputs.registry }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
