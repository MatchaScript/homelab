name: Build Che Development image

on:
  schedule:
    # 3日おき UTC 02:00 = JST 11:00
    - cron: "0 2 */3 * *"
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to registry"
        required: true
        default: false
        type: boolean
      target_registry:
        description: "Target registry (override default)"
        required: false
        type: string
        default: "ghcr.io"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: matchascript
  IMAGE: ubuntu-development
  # renovate: datasource=docker depName=docker.io/library/ubuntu
  DEV_BASE: "docker.io/library/ubuntu:latest@sha256:513c074113a871b51a8d16ab445c88779d6452d937a164fb5cc479f32668a41d"
  CONTEXT_DIR: ./containers

jobs:
  # ════════════════════════════════════════════════════
  #  Prepare
  # ════════════════════════════════════════════════════
  prepare:
    name: Prepare Build Environment
    runs-on: ubuntu-26.04
    outputs:
      current_date: ${{ steps.meta.outputs.current_date }}
      version_id: ${{ steps.meta.outputs.version_id }}
      branch_name: ${{ steps.meta.outputs.branch_name }}
      registry: ${{ steps.meta.outputs.registry }}
      can_push: ${{ steps.meta.outputs.can_push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Podman
        uses: ./.github/actions/setup-podman

      - name: Compute build metadata
        id: meta
        env:
          TZ: "Asia/Tokyo"
          INPUT_REGISTRY: ${{ inputs.target_registry }}
        run: |
          set -euo pipefail
          echo "current_date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          VERSION_ID=$(sudo podman run --rm "$DEV_BASE" cat /etc/os-release | grep '^VERSION_ID=' | cut -d= -f2 | tr -d '"')
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "registry=${INPUT_REGISTRY:-${REGISTRY}}" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "devel" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
          fi

  # ════════════════════════════════════════════════════
  #  Build Che development image — amd64 / arm64
  # ════════════════════════════════════════════════════
  build:
    name: Build Che development image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Podman
        uses: ./.github/actions/setup-podman

      - name: Generate OCI labels
        id: labels
        uses: ./.github/actions/oci-labels
        with:
          title: ${{ env.IMAGE }}
          description: "Development environment image for Eclipse Che workspaces"
          version: "${{ needs.prepare.outputs.version_id }}.${{ needs.prepare.outputs.current_date }}"
          base_name: ${{ env.DEV_BASE }}

      - name: Build image
        env:
          OCI_LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          set -euo pipefail
          LABEL_ARGS=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            LABEL_ARGS+=(--label "$line")
          done <<< "$OCI_LABELS"

          sudo podman build \
            --platform linux/${{ matrix.arch }} \
            --build-arg DEV_BASE="${DEV_BASE}" \
            "${LABEL_ARGS[@]}" \
            --tag temp-dev-${{ matrix.arch }} \
            -f "${CONTEXT_DIR}/che/development.Containerfile" \
            "${CONTEXT_DIR}"

      - name: Test image
        run: |
          sudo podman run --rm temp-dev-${{ matrix.arch }} sh -c '
            set -e
            id | grep -q "uid=1234(user) gid=0(root)"
            test "$HOME" = /home/user
            command -v nohup
            for t in zsh git podman pasta mise chezmoi uv kubectl helm k9s tofu bao gh starship argocd cilium hubble fd rg docker; do
              command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }
            done
            docker buildx version
            docker compose version
          '
          sudo podman run -d --name sshd-test temp-dev-${{ matrix.arch }}
          sleep 3
          sudo podman exec sshd-test ssh-keyscan -p 2022 127.0.0.1 | grep -q ssh-ed25519
          sudo podman rm -f sshd-test

      - name: Generate tags
        id: tags
        uses: ./.github/actions/image-tags
        with:
          image_prefix: ${{ needs.prepare.outputs.registry }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}
          branch: ${{ needs.prepare.outputs.branch_name }}
          date: ${{ needs.prepare.outputs.current_date }}
          version: ${{ needs.prepare.outputs.version_id }}
          arches: ${{ matrix.arch }}

      - name: Login to registry
        if: ${{ (inputs.push_images == true || github.event_name == 'schedule') && needs.prepare.outputs.can_push == 'true' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login -u "${{ github.actor }}" --password-stdin "${{ needs.prepare.outputs.registry }}"

      - name: Tag and push
        if: ${{ (inputs.push_images == true || github.event_name == 'schedule') && needs.prepare.outputs.can_push == 'true' }}
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $(echo "$TAGS" | tr ',' ' '); do
            sudo podman tag temp-dev-${{ matrix.arch }} "${tag}"
            sudo podman push "${tag}"
            echo "Pushed: ${tag}"
          done

      - name: Sign image (cosign keyless)
        if: ${{ (inputs.push_images == true || github.event_name == 'schedule') && needs.prepare.outputs.can_push == 'true' }}
        uses: ./.github/actions/cosign-sign
        with:
          references: ${{ steps.tags.outputs.tags }}
          registry: ${{ needs.prepare.outputs.registry }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}

  # ── Che development multi-arch manifest ───────────────
  manifest:
    name: Create Che development manifest
    runs-on: ubuntu-26.04
    needs: [prepare, build]
    if: ${{ (inputs.push_images == true || github.event_name == 'schedule') && needs.prepare.outputs.can_push == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Podman
        uses: ./.github/actions/setup-podman

      - name: Login to registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login -u "${{ github.actor }}" --password-stdin "${{ needs.prepare.outputs.registry }}"

      - name: Generate tags
        id: tags
        uses: ./.github/actions/image-tags
        with:
          image_prefix: ${{ needs.prepare.outputs.registry }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}
          branch: ${{ needs.prepare.outputs.branch_name }}
          date: ${{ needs.prepare.outputs.current_date }}
          version: ${{ needs.prepare.outputs.version_id }}
          arches: "-"

      - name: Create and push multi-arch manifest
        env:
          IMAGE_PREFIX: ${{ needs.prepare.outputs.registry }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}
          PRIMARY_KEY: ${{ steps.tags.outputs.primary_key }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          AMD64_IMAGE="${IMAGE_PREFIX}:${PRIMARY_KEY}-amd64"
          ARM64_IMAGE="${IMAGE_PREFIX}:${PRIMARY_KEY}-arm64"

          echo "Creating multi-arch manifest from: ${AMD64_IMAGE}, ${ARM64_IMAGE}"
          sudo podman manifest create dev-manifest
          sudo podman manifest add dev-manifest "docker://${AMD64_IMAGE}"
          sudo podman manifest add dev-manifest "docker://${ARM64_IMAGE}"

          for tag in $(echo "${TAGS}" | tr ',' ' '); do
            echo "Pushing manifest as: ${tag}"
            sudo podman manifest push dev-manifest "docker://${tag}"
          done

          sudo podman manifest rm dev-manifest

      - name: Sign multi-arch manifest (cosign keyless)
        uses: ./.github/actions/cosign-sign
        with:
          references: ${{ steps.tags.outputs.tags }}
          registry: ${{ needs.prepare.outputs.registry }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
