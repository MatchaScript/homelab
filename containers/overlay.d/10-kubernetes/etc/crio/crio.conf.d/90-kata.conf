# containers/storage bind-mounts its overlay home onto itself and makes it
# private, so the container rootfs mounts CRI-O creates never propagate into
# the kata shim's mount namespace and the guest gets an empty rootfs. Keep the
# home unmounted so the mounts ride /var's shared propagation instead.
# TODO: drop once the kata shim mounts the rootfs itself on CRI-O:
# https://github.com/kata-containers/kata-containers/pull/12907
# https://github.com/kata-containers/kata-containers/issues/11311
[crio]
storage_option = [
  "overlay.imagestore=/usr/lib/containers/storage",
  "overlay.mountopt=nodev,metacopy=on",
  "overlay.skip_mount_home=true",
]

[crio.runtime.runtimes.kata-clh]
runtime_path = "/opt/kata/runtime-rs/bin/containerd-shim-kata-v2"
runtime_type = "vm"
runtime_root = "/run/vc"
runtime_config_path = "/opt/kata/share/defaults/kata-containers/runtime-rs/configuration-clh-runtime-rs.toml"
privileged_without_host_devices = true
