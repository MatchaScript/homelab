# sshd runs unprivileged as the workspace user, so it listens on a high port
# and keeps its host key in the persistent home.
Port 2022
HostKey /home/user/.ssh/ssh_host_ed25519_key
PidFile none
UsePAM no
PasswordAuthentication no
KbdInteractiveAuthentication no
# The home directory is a PVC that kubelet makes group-writable for fsGroup,
# which StrictModes rejects.
StrictModes no
