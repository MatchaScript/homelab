apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/containerd/nri//contrib/kustomize/device-injector/base?ref=v0.12.3

# The base leaves the image at :latest; pin the release and set the pull
# policy as upstream's components/image-stable does.
images:
  - name: ghcr.io/containerd/nri/plugins/device-injector
    newTag: v0.12.3

patches:
  - target:
      kind: DaemonSet
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      # containerd labels the NRI socket container_var_run_t, which
      # container_t may not write to, so the plugin cannot connect. spc_t is
      # the type for node-level containers that talk to the runtime's sockets.
      - op: add
        path: /spec/template/spec/containers/0/securityContext/seLinuxOptions
        value:
          type: spc_t
