apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/v4.3.1/deployments/multus-daemonset-thick.yml

# The manifest points at the floating snapshot-thick tag; pin the release.
images:
  - name: ghcr.io/k8snetworkplumbingwg/multus-cni
    newTag: v4.3.1-thick

# The nodes scan /var/lib/cni/bin for CNI plugins (CRI-O plugin_dirs), so the
# daemon's binDir, the installer's -d and the cnibin mount are set to it. The
# mount path must equal the host path (multus-daemon resolves plugins by it).
# The DaemonSet patch is a strategic merge patch addressed by container, init
# container and volume name, so an upstream reorder does not break it; the
# volumeMounts merge by mountPath, so the upstream /opt/cni/bin mount of the
# same volume stays beside the new one (same host directory mounted twice
# inside the pod; harmless).
# The thick daemon runs the delegate plugins (cilium-cni) inside its own
# cgroup. Under upstream's 100m / 50Mi limits a burst of pod creations, such
# as the evictions from a node reboot, keeps each CNI ADD past the CRI-O
# deadline and the node never catches up.
patches:
  - target:
      kind: ConfigMap
      name: multus-daemon-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: multus-daemon-config
      data:
        daemon-config.json: |
          {
              "chrootDir": "/hostroot",
              "cniVersion": "0.3.1",
              "logLevel": "verbose",
              "logToStderr": true,
              "binDir": "/var/lib/cni/bin",
              "cniConfigDir": "/host/etc/cni/net.d",
              "multusAutoconfigDir": "/host/etc/cni/net.d",
              "multusConfigFile": "auto",
              "socketDir": "/host/run/multus/"
          }
  - patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: kube-multus-ds
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: kube-multus
                resources:
                  limits:
                    cpu: null
                    memory: 512Mi
                volumeMounts:
                  - name: cnibin
                    mountPath: /var/lib/cni/bin
            initContainers:
              - name: install-multus-binary
                command:
                  - /usr/src/multus-cni/bin/install_multus
                  - -d
                  - /host/var/lib/cni/bin
                  - -t
                  - thick
                volumeMounts:
                  - name: cnibin
                    mountPath: /host/var/lib/cni/bin
                    mountPropagation: Bidirectional
            volumes:
              - name: cnibin
                hostPath:
                  path: /var/lib/cni/bin
